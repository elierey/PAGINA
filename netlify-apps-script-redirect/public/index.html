<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eventos Especiales</title>
    <style>
      :root {
        color-scheme: light;
        --blue: #00528a;
        --ink: #12243a;
        --muted: #607489;
        --line: #d7e4ef;
        --bg: #eef4f8;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: Montserrat, "Segoe UI", Arial, sans-serif;
      }

      main {
        width: min(560px, 100%);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 32px;
        box-shadow: 0 24px 70px rgba(0, 68, 119, .14);
      }

      h1 { margin: 0 0 12px; font-size: 2rem; }
      p { color: var(--muted); line-height: 1.5; }
      code {
        display: block;
        margin-top: 14px;
        padding: 12px;
        background: #f6f9fb;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Eventos Especiales</h1>
      <p>El dominio esta listo. Falta configurar en Netlify la variable <strong>APP_TARGET_URL</strong> con el enlace publicado de Google Apps Script que termina en <strong>/exec</strong>.</p>
      <code>APP_TARGET_URL=https://script.google.com/macros/s/.../exec</code>
    </main>
  </body>
</html>
